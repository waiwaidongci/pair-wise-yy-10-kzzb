<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小型漆线雕工坊管理</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
      --green: #2f7d4f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 68px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button.green { background: var(--green); }
    button.btn-sm { min-height: 28px; padding: 4px 10px; font-size: 12px; }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .item.s-pending { border-left-color: var(--teal); }
    .item.s-repair { border-left-color: var(--amber); }
    .item.s-done { border-left-color: var(--green); }
    .board { display: grid; grid-template-columns: repeat(4, minmax(185px, 1fr)); gap: 12px; overflow-x: auto; }
    .board3 { display: grid; grid-template-columns: repeat(3, minmax(230px, 1fr)); gap: 12px; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(620px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 12px; max-height: 86vh; overflow-y: auto; }
    .dialog-body h2 { margin: 0; font-size: 18px; }
    .dsec { border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; background: #fbfdfb; display: grid; gap: 8px; }
    .dhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dhead h3 { margin: 0; font-size: 14px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .inline { display: flex; gap: 8px; align-items: center; }
    .inline select { width: 96px; flex: none; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .b-pending { background: #e2f0ef; color: var(--teal); }
    .b-repair { background: #f6ecd8; color: var(--amber); }
    .b-done { background: #e2f1e7; color: var(--green); }
    .b-void { background: #ece8f2; color: var(--violet); }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 4px; }
    .chip.c-broken { background: #f3dddd; color: var(--red); }
    .chip.c-lift { background: #f6ecd8; color: var(--amber); }
    .chip.done { opacity: 0.55; }
    .chip-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 3px 0; }
    .reasons { margin: 0; padding-left: 18px; font-size: 13px; color: var(--amber); }
    .hist { margin: 0; padding-left: 16px; font-size: 12.5px; }
    .hist li { margin-bottom: 4px; }
    .hint { font-size: 12px; color: var(--muted); }
    .queue-no { color: var(--violet); font-weight: 600; }
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px); background: #243028; color: #fff; padding: 10px 16px; border-radius: 7px; font-size: 13.5px; max-width: min(560px, 92vw); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; white-space: pre-line; z-index: 10; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.warn { background: var(--amber); }
    #toast.bad { background: var(--red); }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .lists, .toolbar, .board3 { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>小型漆线雕工坊管理</h1>
      <div class="sub">贴线、阴干、上金粉、待交付的作品流转 · 客户验稿签收与作废履历</div>
    </div>
    <button id="exportBtn" class="secondary">导出 JSON</button>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
        </div>
        <div class="grid2">
          <label>阴干日期<input name="dryDate" type="date" required></label>
          <label>交付日期<input name="delivery" type="date" required></label>
        </div>
        <div class="grid2">
          <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
          <label>当前状态<select name="status"><option>贴线中</option><option>待阴干</option><option>上金粉</option><option>待交付</option></select></label>
        </div>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入工坊</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini">
            <h3>今日待阴干</h3>
            <div id="todayDry"></div>
          </div>
          <div class="mini">
            <h3>缺陷作品</h3>
            <div id="defectList"></div>
          </div>
          <div class="mini">
            <h3>最近交付</h3>
            <div id="deliveryList"></div>
          </div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>交付排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
          <button id="clearFilters" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>

    <section class="panel">
      <h2>客户验稿看板</h2>
      <div class="toolbar" style="grid-template-columns: 1fr 1fr auto;">
        <label>筛选客户 / 纹样 / 胎体<input id="inspectFilter" placeholder="例如：林女士、缠枝"></label>
        <div class="hint" style="display:flex;align-items:flex-end;padding-bottom:9px;">每件作品至多一张未结束验稿单；进度满且无断线翘线方可签收。</div>
        <button id="inspectClear" class="secondary" style="align-self:end;">清空筛选</button>
      </div>
      <div id="inspectionBoard" class="board3"></div>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailWork"></div>
      <div id="detailDefects"></div>
      <div id="detailInspection"></div>
      <details class="dsec">
        <summary class="dhead" style="cursor:pointer;"><h3>作品履历（含旧签字）</h3></summary>
        <ul id="detailHistory" class="hist meta"></ul>
      </details>
      <div class="actions">
        <button id="closeDialog" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <div id="toast"></div>

  <!-- 作品数据层：localStorage 持久化与作品/缺陷增改 -->
  <script src="js/store.js"></script>
  <!-- 验稿判定层：验稿单生命周期、签收判定、签字作废规则（纯业务规则，不碰 DOM） -->
  <script src="js/inspection.js"></script>
  <!-- 页面操作层：渲染、事件、看板 -->
  <script src="js/app.js"></script>
</body>
</html>
